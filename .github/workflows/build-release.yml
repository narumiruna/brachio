name: Build release artifacts

on:
  workflow_call:
    inputs:
      release-commit:
        description: Verified release commit returned by Changenote.
        required: true
        type: string
      version:
        description: Expected package version returned by Changenote.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # zizmor: ignore[superfluous-actions] -- Select stable independently of the runner default.
        with:
          components: rustfmt, clippy
      - run: uv lock --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: cargo publish --locked --dry-run

  wheels:
    name: wheels (${{ matrix.runner }}, ${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release-commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build platform wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --locked --out dist --compatibility pypi
      - name: Check installed wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual=$(uvx --isolated --no-index --find-links dist brachio --version)
          test "$actual" = "brachio $EXPECTED_VERSION"
          uvx --isolated --no-index --find-links dist brachio --help
      - name: Build source distribution
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
