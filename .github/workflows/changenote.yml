name: Changenotes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Show pending releases
        run: uvx changenote==0.9.2 status --include-note-paths
      - name: Check PR notes
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SKIP_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changenote') }}
        run: |
          args=(check "--since=refs/remotes/origin/$BASE_BRANCH" --coverage=package)
          if [[ "$SKIP_RELEASE" == "true" ]]; then
            args+=(--skip-release --reason "Maintainer approved a note exemption; see the PR description.")
          fi
          uvx changenote==0.9.2 "${args[@]}"
