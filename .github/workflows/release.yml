name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select note policy
        id: note-policy
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: bash .github/scripts/pr-note-policy.sh
      - name: Check PR notes
        uses: changenote/action/check@b5a808ce21642ccc01587dc66fd34ce522b74da9 # v0.4.0
        with:
          since: refs/remotes/origin/${{ github.base_ref }}
          coverage: package
          skip-release: ${{ steps.note-policy.outputs.skip-release }}
          reason: ${{ steps.note-policy.outputs.reason }}

  release:
    name: release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      publication-needed: ${{ steps.release.outputs.publication-needed }}
      release-commit: ${{ steps.release.outputs.release-commit }}
      version: ${{ steps.release.outputs.release-commit != '' && fromJSON(steps.release.outputs.releases)[0].version || '' }}
    steps:
      - name: Check release token
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [[ -z "$PAT_TOKEN" ]]; then
            echo '::error::Set the PAT_TOKEN repository secret before running Release.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Manage release
        uses: changenote/action@b5a808ce21642ccc01587dc66fd34ce522b74da9 # v0.4.0
        id: release
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          base-branch: main
          push-git-tags: 'true'
          create-github-releases: 'true'

  build:
    needs: release
    if: needs.release.outputs.publication-needed == 'true' && needs.release.outputs.release-commit != ''
    uses: ./.github/workflows/build-release.yml # zizmor: ignore[self-repository] -- Caller-commit workflow; actionlint does not support $/ syntax.
    with:
      release-commit: ${{ needs.release.outputs.release-commit }}
      version: ${{ needs.release.outputs.version }}

  crates-io:
    name: crates-io
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/brachio
    permissions:
      contents: read
      id-token: write # Request a short-lived crates.io publishing token.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.release-commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # zizmor: ignore[superfluous-actions] -- Select stable independently of the runner default.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  pypi:
    name: pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/brachio/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        # PyPI uses its configured environment token; Trusted Publishing is not configured.
        run: uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/* # zizmor: ignore[use-trusted-publishing]
