[package]
name = "brachio"
version = "0.1.0"
edition = "2024"
description = "A Rex coding agent status TUI"
license = "MIT"
repository = "https://github.com/narumiruna/brachio"
readme = "README.md"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
